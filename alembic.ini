# Alembic 마이그레이션 설정 파일

[alembic]
# 마이그레이션 스크립트 템플릿 경로
script_location = alembic

# 마이그레이션 파일명 템플릿 (타임스탬프_설명)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path 추가 경로
prepend_sys_path = .

# 타임존 설정 (UTC 사용)
timezone = UTC

# 출력 인코딩
output_encoding = utf-8

# 데이터베이스 URL (env.py에서 동적으로 설정됨)
sqlalchemy.url =

# 로깅 설정
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
